<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sade Lezzetler</title>
<meta name="description" content="Sade Lezzetler - Menü, konum ve iletişim">
<meta name="theme-color" content="#445C36">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --moss:#445C36;
    --moss-deep:#26311F;
    --oat:#EDE6D2;
    --oat-soft:#F5F1E4;
    --mustard:#C4872B;
    --line:rgba(38,49,31,0.16);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--oat);
    color:var(--moss-deep);
    font-family:"Work Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
    padding:56px 20px 28px;
  }
  .page{
    width:100%;
    max-width:400px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    animation:rise 0.6s ease-out both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  .logo{
    width:80px;
    height:80px;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 0 0 3px var(--oat), 0 0 0 4px var(--line);
  }
  h1{
    font-family:"Fraunces",Georgia,serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:2.1rem;
    margin:22px 0 6px;
    color:var(--moss-deep);
  }
  .tagline{
    font-family:"Fraunces",Georgia,serif;
    font-style:italic;
    font-weight:500;
    font-size:1.02rem;
    color:var(--moss);
    margin:0 0 44px;
  }

  .primary-action{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:19px 24px;
    background:var(--moss);
    color:var(--oat-soft);
    text-decoration:none;
    border-radius:8px;
    font-size:1.12rem;
    font-weight:600;
    letter-spacing:0.01em;
    transition:background 0.15s ease, transform 0.15s ease;
  }
  .primary-action:hover, .primary-action:focus-visible{
    background:var(--moss-deep);
    transform:translateY(-1px);
  }
  .primary-action:focus-visible{ outline:2px solid var(--mustard); outline-offset:3px; }
  .primary-action .ic{ font-size:1.25rem; }

  .secondary-row{
    display:flex;
    gap:12px;
    width:100%;
    margin-top:14px;
  }
  .secondary-action{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:14px 16px;
    background:transparent;
    border:1.5px solid var(--line);
    color:var(--moss-deep);
    text-decoration:none;
    border-radius:8px;
    font-size:0.96rem;
    font-weight:500;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .secondary-action:hover, .secondary-action:focus-visible{
    border-color:var(--moss);
    background:rgba(68,92,54,0.06);
  }
  .secondary-action:focus-visible{ outline:2px solid var(--mustard); outline-offset:2px; }

  .divider{
    width:100%;
    max-width:220px;
    border:none;
    border-top:1px solid var(--line);
    margin:48px 0 26px;
  }

  .contact{
    font-size:0.92rem;
    line-height:1.9;
    color:var(--moss-deep);
    opacity:0.85;
  }
  .signature{
    margin-top:22px;
    font-size:0.88rem;
    color:var(--moss);
  }
  .copyright{
    margin-top:18px;
    font-size:0.76rem;
    color:var(--moss-deep);
    opacity:0.5;
  }

  @media (prefers-reduced-motion: reduce){
    .page{ animation:none; }
    .primary-action, .secondary-action{ transition:none; }
  }
</style>
</head>
<body>

  <div class="page">
    <img class="logo" src="https://sadelezzetler.github.io/menu/logo.png" alt="Sade Lezzetler logosu">
    <h1>Sade Lezzetler</h1>
    <p class="tagline">az malzeme, çok lezzet</p>

    <a class="primary-action" href="https://sadelezzetler.github.io/menu/">
      <span class="ic">📋</span>
      <span>Menüyü Gör</span>
    </a>

    <div class="secondary-row">
      <!-- TODO: Google Maps linkini buraya ekle -->
      <a class="secondary-action" href="#">
        <span>📍</span>
        <span>Konum</span>
      </a>
      <!-- TODO: instagram.com/kullaniciadi linkini ekle -->
      <a class="secondary-action" href="#">
        <span>📸</span>
        <span>Instagram</span>
      </a>
    </div>

    <hr class="divider">

    <!-- TODO: telefon ve adres bilgilerini buraya yaz -->
    <div class="contact">
      📞 Telefon buraya<br>
      📍 Adres buraya
    </div>

    <p class="signature">🌱 Doğal • ♻️ Sürdürülebilir • 💚 Sağlıklı</p>
    <p class="copyright">© 2026 Sade Lezzetler</p>
  </div>

</body>
</html>
